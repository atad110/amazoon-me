<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サービス案内</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
  color:#222;
  background:#f7f9fc;
}
.header{
  padding:20px 24px;
  background:#fff;
  border-bottom:1px solid #e8edf3;
}
.logo{
  font-size:18px;
  font-weight:600;
  color:#24569c;
}
.hero{
  max-width:960px;
  margin:0 auto;
  padding:70px 24px 50px;
  text-align:center;
}
.hero h1{
  font-size:32px;
  line-height:1.4;
  margin:0 0 18px;
}
.hero p{
  font-size:16px;
  line-height:1.8;
  color:#555;
  margin:0 auto 20px;
  max-width:680px;
}
.section{
  max-width:960px;
  margin:0 auto;
  padding:20px 24px 60px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}
.card{
  background:#fff;
  border-radius:18px;
  padding:24px;
  box-shadow:0 8px 24px rgba(30,50,80,.08);
}
.card h3{
  font-size:18px;
  margin:0 0 10px;
}
.card p{
  font-size:14px;
  line-height:1.7;
  color:#666;
  margin:0;
}
.footer{
  text-align:center;
  padding:28px 20px;
  font-size:12px;
  color:#888;
  background:#fff;
}
@media(max-width:720px){
  .hero{
    padding:52px 20px 36px;
  }
  .hero h1{
    font-size:25px;
  }
  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>
<body>

<header class="header">
  <div class="logo">Service Guide</div>
</header>

<main>
  <section class="hero">
    <h1>暮らしをもっと便利に、わかりやすく。</h1>
    <p>
      このページでは、サービスの内容やご利用方法についてご案内しています。
      必要な情報をわかりやすく整理し、快適にご確認いただけるよう設計されています。
    </p>
  </section>

  <section class="section">
    <div class="grid">
      <div class="card">
        <h3>わかりやすい案内</h3>
        <p>必要な情報を整理し、初めての方にも見やすい構成で掲載しています。</p>
      </div>
      <div class="card">
        <h3>スマートフォン対応</h3>
        <p>スマートフォン、タブレット、パソコンなど、さまざまな画面で快適に表示できます。</p>
      </div>
      <div class="card">
        <h3>シンプルな操作</h3>
        <p>余計な機能を減らし、目的の情報へスムーズに進めるようにしています。</p>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  © 2026 Service Guide. All rights reserved.
</footer>

</body>
</html>
