<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>インフォメーション</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
  background:#f4f7fb;
  color:#222;
}
.header{
  background:#fff;
  padding:22px 28px;
  border-bottom:1px solid #e6ebf1;
}
.logo{
  font-size:18px;
  font-weight:700;
  color:#2b5f9e;
}
.main{
  max-width:1000px;
  margin:0 auto;
  padding:64px 24px;
}
.hero{
  background:#fff;
  border-radius:24px;
  padding:48px 34px;
  text-align:center;
  box-shadow:0 12px 36px rgba(40,60,90,.10);
}
.hero h1{
  margin:0 0 18px;
  font-size:32px;
  line-height:1.4;
}
.hero p{
  max-width:680px;
  margin:0 auto;
  font-size:16px;
  line-height:1.9;
  color:#555;
}
.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
  margin-top:28px;
}
.card{
  background:#fff;
  border-radius:20px;
  padding:26px;
  box-shadow:0 8px 24px rgba(40,60,90,.08);
}
.card h2{
  font-size:18px;
  margin:0 0 12px;
}
.card p{
  font-size:14px;
  line-height:1.8;
  color:#666;
  margin:0;
}
.footer{
  text-align:center;
  padding:30px 20px;
  font-size:12px;
  color:#888;
  background:#fff;
}
@media(max-width:760px){
  .main{padding:42px 18px}
  .hero{padding:38px 24px}
  .hero h1{font-size:25px}
  .cards{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="header">
  <div class="logo">Information Guide</div>
</header>

<main class="main">
  <section class="hero">
    <h1>必要な情報を、見やすく整理しました。</h1>
    <p>
      このページでは、サービスの内容やお知らせをわかりやすく掲載しています。
      スマートフォンやパソコンから、快適に内容をご確認いただけます。
    </p>
  </section>

  <section class="cards">
    <div class="card">
      <h2>見やすい構成</h2>
      <p>重要な内容を整理し、はじめての方にもわかりやすいページ構成にしています。</p>
    </div>

    <div class="card">
      <h2>快適な表示</h2>
      <p>スマートフォン、タブレット、パソコンなど、さまざまな画面サイズに対応しています。</p>
    </div>

    <div class="card">
      <h2>シンプルな内容</h2>
      <p>余計な動作を入れず、必要な情報を落ち着いて確認できるようにしています。</p>
    </div>
  </section>
</main>

<footer class="footer">
  © 2026 Information Guide. All rights reserved.
</footer>

</body>
</html>
